<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, 
        maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>UTEQGram</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css">
  <link rel="stylesheet" href="/src/css/app.css">
  <link rel="stylesheet" href="/src/css/help.css">
  <link rel="stylesheet" href="/src/css/feed.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3f51b5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UTEQGram">
  <link rel="apple-touch-icon" href="/src/images/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/src/images/icons/icon-192x192.png">
</head>

<body>

  <div id="app">
    <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
      <header class="mdl-layout__header">
        <div class="mdl-layout__header-row">
          <!-- Title -->
          <span class="mdl-layout-title">UTEQGram</span>
          <!-- Add spacer, to align navigation to the right -->
          <div class="mdl-layout-spacer"></div>
          <!-- Navigation. We hide it in small screens. -->
          <nav class="mdl-navigation mdl-layout--large-screen-only">
            <a class="mdl-navigation__link" href="/">Feed</a>
            <a class="mdl-navigation__link" href="/help">Help</a>
            <div class="drawer-option">
              <button class="enable-notifications mdl-button mdl-js-button 
            mdl-button--raised mdl-button--colored mdl-color--accent">
                Habilitar Notificaciones
              </button>
            </div>
          </nav>
        </div>
      </header>
      <div class="mdl-layout__drawer">
        <span class="mdl-layout-title">UTEQGram</span>
        <nav class="mdl-navigation">
          <a class="mdl-navigation__link" href="/">Feed</a>
          <a class="mdl-navigation__link" href="/help">Help</a>
          <div class="drawer-option">
            <button class="enable-notifications mdl-button mdl-js-button 
          mdl-button--raised mdl-button--colored mdl-color--accent">
              Habilitar Notificaciones
            </button>
          </div>
        </nav>
      </div>
      <main class="mdl-layout__content mat-typography">
        <div id="create-post">
          <form>
            <!-- Cámara del dispositivo -->
            <div id="camera-area">
              <video id="player" autoplay playsinline muted></video>
              <canvas id="canvas"></canvas>
              <div id="camera-message"></div>
              <div class="camera-buttons">
                <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" type="button"
                  id="capture-btn">
                  <i class="material-icons">photo_camera</i> Tomar foto
                </button>
                <button class="mdl-button mdl-js-button mdl-button--raised" type="button" id="switch-camera-btn">
                  <i class="material-icons">flip_camera_android</i>
                </button>
                <button class="mdl-button mdl-js-button mdl-button--raised" type="button" id="retake-btn">
                  <i class="material-icons">replay</i> Otra
                </button>
              </div>
              <div id="pick-image">
                <h6>¿Sin cámara? Elige una imagen</h6>
                <input type="file" accept="image/*" capture="environment" id="image-picker">
              </div>
            </div>
            <div class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
              <input class="mdl-textfield__input" type="text" id="title">
              <label class="mdl-textfield__label" for="title" name="title">Title</label>
            </div>
            <div class="input-section mdl-textfield mdl-js-textfield mdl-textfield--floating-label"
              id="manual-location">
              <input class="mdl-textfield__input" type="text" id="location">
              <label class="mdl-textfield__label" for="location" name="location">Location</label>
            </div>
            <div class="input-section">
              <button class="mdl-button mdl-js-button mdl-button--colored" type="button" id="location-btn">
                <i class="material-icons">my_location</i> Usar mi ubicación
              </button>
              <div class="mdl-spinner mdl-js-spinner is-active" id="location-loader"></div>
            </div>
            <br>
            <div>
              <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored mdl-color--accent"
                type="submit" id="post-btn">Postear!
              </button>
            </div>
            <br>
            <div>
              <button class="mdl-button mdl-js-button mdl-button--fab" id="close-create-post-modal-btn" type="button">
                <i class="material-icons">close</i>
              </button>
            </div>
          </form>
        </div>
        <img src="/src/images/main-image.jpg" alt="Explore the City" class="main-image">
        <div class="text-center" id="install-area">
          <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" id="install-btn" type="button">
            <i class="material-icons">install_mobile</i> Instalar app
          </button>
        </div>
        <div class="page-content">
          <h5 class="text-center mdl-color-text--primary">Comparte tus Momentos</h5>
          <div id="shared-moments"></div>
        </div>
        <div class="floating-button">
          <button class="mdl-button mdl-js-button mdl-button--fab mdl-button--colored" id="share-image-button">
            <i class="material-icons">add</i>
          </button>
        </div>
        <div id="confirmation-toast" aria-live="assertive" aria-atomic="true" aria-relevant="text"
          class="mdl-snackbar mdl-js-snackbar">
          <div class="mdl-snackbar__text"></div>
          <button type="button" class="mdl-snackbar__action"></button>
        </div>
      </main>
    </div>
  </div>

  <script defer src="/src/js/material.min.js"></script>
  <script defer src="/src/js/idb.js"></script>
  <script defer src="/src/js/utility.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.min.js"></script>
  <script defer src="/src/js/app.js"></script>
  <script defer src="/src/js/feed.js"></script>
</body>

</html>
